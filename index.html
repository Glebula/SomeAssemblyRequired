<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/SomeAssemblyRequired/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Some Assembly Required</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0a0e1a; min-height: 100vh; }
      #root { min-height: 100vh; }
    </style>
    <script type="module" crossorigin src="/SomeAssemblyRequired/assets/index-yMRtxK24.js"></script>
    <link rel="stylesheet" crossorigin href="/SomeAssemblyRequired/assets/index-G5UiSNix.css">
  </head>
  <body>
    <div id="root">
      <div id="app-loading" style="min-height:100vh;background:#0a0e1a;display:flex;align-items:center;justify-content:center;font-family:monospace;color:#8892b0;flex-direction:column;gap:12px;">
        <div>Loading...</div>
        <div id="err" style="color:#ef4444;font-size:12px;max-width:500px;text-align:center;padding:0 16px;"></div>
      </div>
    </div>
    <script>
      (function() {
        var protocolWarning = document.getElementById('err');
        if (window.location.protocol === 'file:' && protocolWarning) {
          protocolWarning.textContent = 'This app cannot run from file://. Start a server with "npm run dev" or serve the dist/ folder.';
        }

        // If someone serves the repository root instead of the build output,
        // automatically jump to /dist where Vite's compiled app lives.
        var isRepoRoot = window.location.pathname.endsWith('/index.html') || window.location.pathname === '/';
        var alreadyInDist = window.location.pathname.includes('/dist/');
        if (!alreadyInDist && window.location.protocol !== 'file:' && isRepoRoot) {
          fetch('./dist/index.html', { method: 'HEAD' })
            .then(function(res) {
              if (res.ok) {
                window.location.replace('./dist/');
              }
            })
            .catch(function() {
              // Ignore — normal dev mode won't have a dist folder.
            });
        }
      })();

      window.addEventListener('error', function(e) {
        var el = document.getElementById('err');
        if (el) el.textContent = 'JS Error: ' + (e.message || 'unknown') + (e.filename ? ' @ ' + e.filename : '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('err');
        if (el) el.textContent = 'Promise Error: ' + (e.reason?.message || e.reason || 'unknown');
      });

      // If React hasn't mounted after a few seconds, surface guidance instead of a silent loader.
      setTimeout(function() {
        var loader = document.getElementById('app-loading');
        var el = document.getElementById('err');
        if (loader && loader.isConnected && el && !el.textContent) {
          el.textContent = 'App failed to start. If you are hosting the repo root, run npm run build and serve dist/. Otherwise run npm run dev.';
        }
      }, 4000);
    </script>
  </body>
</html>
